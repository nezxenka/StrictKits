plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

def isLegacy = findProperty('legacy') != null
def apiVersion = isLegacy ? '1.16' : '1.21'
def javaRelease = isLegacy ? 16 : 21
def paperApi = isLegacy
        ? 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
        : 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'

group = 'org.nezxenka'
version = '3.0'

java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

configurations {
    shaded
    compileOnly.extendsFrom shaded
}

dependencies {
    compileOnly paperApi
    compileOnly 'me.clip:placeholderapi:2.11.6'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    shaded 'com.zaxxer:HikariCP:6.2.1'

    shaded('com.mysql:mysql-connector-j:9.4.0') {
        exclude group: 'com.google.protobuf'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

processResources {
    def tokens = [version: version, apiVersion: apiVersion]
    inputs.properties(tokens)
    filteringCharset = 'UTF-8'
    filesMatching('*.yml') {
        expand(tokens)
    }
}

jar {
    enabled = false
}

shadowJar {
    archiveClassifier.set(isLegacy ? 'legacy' : '')
    configurations = [project.configurations.shaded]

    mergeServiceFiles()

    relocate 'com.zaxxer.hikari', 'org.nezxenka.strictkits.libs.hikari'
    relocate 'com.mysql', 'org.nezxenka.strictkits.libs.mysql'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/native-image/**'
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'

    exclude 'com/mysql/cj/xdevapi/**'
    exclude 'com/mysql/cj/x/**'
}

build.dependsOn shadowJar
